<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Padhaus — Token Details</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.umd.min.js"></script>
<script src="chains.js?v=20261123c"></script>
<script src="app.js?v=20261123c"></script>
</head>
<body>
<header>
  <a href="index.html">Padhaus</a> <span class="muted">— fair-launch launchpad</span>
  <nav>
    <a href="index.html">Tokens</a>
    <a href="launch.html">Launch Token</a>
  </nav>
  <div class="header-right">
    <select id="chainSwitcher" class="chain-switcher" aria-label="Network"></select>
    <span class="muted chain-badge">BSC Testnet · chain 97 · PROTOTYPE</span>
  </div>
</header>
<main>
  <div id="notice" class="banner"></div>
  <div class="card-head">
    <div class="logo-slot" id="logoSlot"><span class="token-logo token-logo-placeholder">?</span></div>
    <div class="card-title">
      <h2 id="title">Token details</h2>
      <p class="mono" id="addr"></p>
    </div>
  </div>
  <p class="muted" id="description"></p>
  <p id="links"></p>
  <div class="card">
    <table>
      <tr><th>Spot price</th><td id="price">—</td></tr>
      <tr><th>Quote collected (real)</th><td id="realQuote">—</td></tr>
      <tr><th>Tokens sold from curve</th><td id="sold">—</td></tr>
      <tr><th>Status</th><td id="grad">—</td></tr>
      <tr><th>Creator</th><td id="creator" class="mono">—</td></tr>
      <tr><th>My token balance</th><td id="myBal">— (connect wallet)</td></tr>
    </table>
    <p><button id="connect" class="secondary">Connect Wallet</button> <button id="disconnect" class="secondary" style="display:none">Disconnect</button> <span id="acct" class="muted"></span></p>
  </div>
  <div class="grid">
    <div class="card">
      <h3>Buy</h3>
      <label>Amount <span data-native-symbol>tBNB</span></label>
      <input id="buyAmount" type="number" step="any" min="0" placeholder="0.05">
      <p class="muted" id="buyQuote">Estimate: —</p>
      <button id="buyBtn" disabled>Buy</button>
    </div>
    <div class="card">
      <h3>Sell</h3>
      <label>Token amount</label>
      <input id="sellAmount" type="number" step="any" min="0" placeholder="1000">
      <p class="muted" id="sellQuote">Estimate: —</p>
      <button id="sellBtn" disabled>Sell</button>
    </div>
  </div>
  <p id="status" class="muted"></p>
</main>
<script>
const params = new URLSearchParams(location.search);
const tokenAddr = params.get("address");
let signer = null, account = null;

async function refresh() {
  const factory = getReadFactory();
  const token = getReadToken(tokenAddr);
  const [name, symbol, price, curve] = await Promise.all([
    token.name(), token.symbol(), factory.spotPrice(tokenAddr), factory.getCurve(tokenAddr)
  ]);
  document.getElementById("title").textContent = name + " ($" + symbol + ")";
  document.getElementById("addr").textContent = tokenAddr;
  document.getElementById("price").textContent = fmt(price) + " " + nativeSymbol() + " / token";
  document.getElementById("realQuote").textContent = fmt(curve.realQuote) + " " + nativeSymbol();
  document.getElementById("sold").textContent = fmt(curve.tokensSold) + " token";
  document.getElementById("grad").textContent = curve.graduated ? "Graduated (curve stopped)" : "On bonding curve";
  document.getElementById("creator").textContent = curve.creator;
  if (account) {
    document.getElementById("myBal").textContent = fmt(await token.balanceOf(account)) + " token";
  }
  // Logo, description and project links come from the token's
  // metadataURI (IPFS); the on-chain name/symbol above stay authoritative
  // if metadata is absent.
  const logoSlot = document.getElementById("logoSlot");
  logoSlot.innerHTML = tokenLogoPlaceholderHtml(symbol);
  document.getElementById("links").innerHTML = "";
  resolveTokenMetadata(tokenAddr, curve.metadataURI).then((meta) => {
    if (!meta) return;
    if (meta.image) {
      logoSlot.innerHTML = '<img class="token-logo" src="' + esc(meta.image) + '" alt="" loading="lazy">';
      logoSlot.querySelector("img").onerror = () => { logoSlot.innerHTML = tokenLogoPlaceholderHtml(symbol); };
    }
    if (meta.description) document.getElementById("description").textContent = meta.description;
    const linksHtml = tokenLinksHtml(meta);
    if (linksHtml) document.getElementById("links").innerHTML = linksHtml;
  }).catch(() => {});
  await updateQuotes();
}

async function updateQuotes() {
  const factory = getReadFactory();
  const b = document.getElementById("buyAmount").value;
  const s = document.getElementById("sellAmount").value;
  try {
    if (b && Number(b) > 0) {
      const [out, fee] = await factory.quoteBuy(tokenAddr, ethers.parseEther(b));
      document.getElementById("buyQuote").textContent = "Estimated receive: " + fmt(out) + " token (fee " + fmt(fee) + " " + nativeSymbol() + ")";
    }
    if (s && Number(s) > 0) {
      const [net, fee] = await factory.quoteSell(tokenAddr, ethers.parseEther(s));
      document.getElementById("sellQuote").textContent = "Estimated receive: " + fmt(net) + " " + nativeSymbol() + " (fee " + fmt(fee) + " " + nativeSymbol() + ")";
    }
  } catch (_) { /* ignore while input is invalid */ }
}

(async () => {
  await loadDeployment();
  if (deploymentNotice(document.getElementById("notice"))) return;
  if (!tokenAddr) { banner(document.getElementById("notice"), "Missing ?address= parameter.", true); return; }
  await refresh();
})();

document.getElementById("connect").onclick = async () => {
  try {
    ({ signer, account } = await connectWallet());
    document.getElementById("acct").textContent = account;
    document.getElementById("disconnect").style.display = "";
    document.getElementById("buyBtn").disabled = false;
    document.getElementById("sellBtn").disabled = false;
    await refresh();
  } catch (e) { document.getElementById("status").textContent = "Failed: " + e.message; }
};
document.getElementById("disconnect").onclick = async () => { await disconnectWallet(); };
window.addEventListener("padhaus:disconnected", () => {
  signer = null; account = null;
  document.getElementById("acct").textContent = "";
  document.getElementById("disconnect").style.display = "none";
  document.getElementById("buyBtn").disabled = true;
  document.getElementById("sellBtn").disabled = true;
  document.getElementById("myBal").textContent = "— (connect wallet)";
  document.getElementById("status").textContent = "Wallet disconnected.";
});
document.getElementById("buyAmount").oninput = updateQuotes;
document.getElementById("sellAmount").oninput = updateQuotes;

document.getElementById("buyBtn").onclick = async () => {
  const status = document.getElementById("status");
  const amt = document.getElementById("buyAmount").value;
  try {
    const factory = getWriteFactory(signer);
    const [out] = await getReadFactory().quoteBuy(tokenAddr, ethers.parseEther(amt));
    const minOut = out * 99n / 100n; // slippage 1%
    status.textContent = "Waiting for signature…";
    const tx = await factory.buy(tokenAddr, minOut, { value: ethers.parseEther(amt) });
    status.textContent = "Sent: " + tx.hash + " — waiting for confirmation…";
    await tx.wait();
    status.textContent = "Buy successful. Tx: " + tx.hash;
    await refresh();
  } catch (e) { status.textContent = "Failed: " + (e.shortMessage || e.message); }
};

document.getElementById("sellBtn").onclick = async () => {
  const status = document.getElementById("status");
  const amt = document.getElementById("sellAmount").value;
  try {
    const amount = ethers.parseEther(amt);
    const token = new ethers.Contract(tokenAddr, ERC20_ABI, signer);
    const fAddr = factoryAddress();
    const allowance = await token.allowance(account, fAddr);
    if (allowance < amount) {
      status.textContent = "Approve first: waiting for signature…";
      const atx = await token.approve(fAddr, amount);
      await atx.wait();
    }
    const factory = getWriteFactory(signer);
    const [net] = await getReadFactory().quoteSell(tokenAddr, amount);
    const minOut = net * 99n / 100n;
    status.textContent = "Waiting for sell signature…";
    const tx = await factory.sell(tokenAddr, amount, minOut);
    status.textContent = "Sent: " + tx.hash + " — waiting for confirmation…";
    await tx.wait();
    status.textContent = "Sell successful. Tx: " + tx.hash;
    await refresh();
  } catch (e) { status.textContent = "Failed: " + (e.shortMessage || e.message); }
};
</script>
</body>
</html>
